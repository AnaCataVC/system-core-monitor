name: Build & Test CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to'
        required: false
        default: 'v3.7.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compile System Core Monitor (.NET 9)
        run: dotnet build src/SystemCoreMonitor.csproj -c Release

      - name: Run Packaging Script
        run: pwsh -ExecutionPolicy Bypass -File scripts/Build-Package.ps1

      - name: Compile Setup Wizard Installer
        run: msbuild src/Installer/Installer.csproj /p:Configuration=Release /p:Platform=AnyCPU /v:m

      - name: Run Native Health Tests
        run: pwsh -ExecutionPolicy Bypass -File tests/Metrics.Tests.ps1

      - name: Run Deep Stress Tests
        run: pwsh -ExecutionPolicy Bypass -File tests/DeepStress.Tests.ps1

      - name: Run AI Transcript Unit Tests
        run: pwsh -ExecutionPolicy Bypass -File tests/AiTranscript.Tests.ps1

      - name: Run Windows 11 Widgets Tests
        run: pwsh -ExecutionPolicy Bypass -File tests/Widgets.Tests.ps1

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SystemCoreMonitor-Binaries
          path: |
            releases/SystemCoreMonitor-Setup.exe

      - name: Attach Asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $targetTag = if ('${{ github.event.inputs.tag }}') { '${{ github.event.inputs.tag }}' } else { '${{ github.ref_name }}' }
          Write-Host "Attaching SystemCoreMonitor-Setup.exe to release $targetTag..."
          gh release upload $targetTag releases/SystemCoreMonitor-Setup.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
